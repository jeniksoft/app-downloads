name: Public IP provenance evidence package
on:
  workflow_dispatch:
    inputs:
      milestone:
        description: Protected public release or IP milestone identifier
        required: true
        type: string
permissions:
  contents: read
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
jobs:
  evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Create public distribution evidence
        shell: bash
        run: |
          set -euo pipefail
          test -s IP_PROVENANCE.md
          mkdir -p evidence
          cp IP_PROVENANCE.md evidence/IP_PROVENANCE.md
          git archive --format=tar.gz --output "evidence/public-tree-${GITHUB_SHA}.tar.gz" "${GITHUB_SHA}"
          printf '%s\n' "$GITHUB_REPOSITORY" > evidence/repository.txt
          printf '%s\n' "$GITHUB_REF_NAME" > evidence/branch.txt
          printf '%s\n' "$GITHUB_SHA" > evidence/source-commit.txt
          printf '%s\n' "${{ inputs.milestone }}" > evidence/milestone.txt
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@v0.24.0
        with:
          path: .
          format: spdx-json
          output-file: evidence/sbom.spdx.json
          upload-artifact: false
          dependency-snapshot: false
      - name: License and provenance gate
        shell: python
        run: |
          import json, pathlib, re, sys
          data=json.loads(pathlib.Path('evidence/sbom.spdx.json').read_text(encoding='utf-8'))
          blocked=re.compile(r'(^|[^A-Z])(AGPL|GPL|SSPL|BUSL)(-|$|[^A-Z])',re.I)
          findings=[]
          for pkg in data.get('packages',[]):
              name=pkg.get('name','<unknown>'); version=pkg.get('versionInfo','')
              declared=str(pkg.get('licenseDeclared','NOASSERTION')); concluded=str(pkg.get('licenseConcluded','NOASSERTION'))
              if declared in ('NOASSERTION','NONE','') or concluded in ('NOASSERTION','NONE',''):
                  findings.append((name,version,'UNKNOWN',declared,concluded))
              elif blocked.search(declared) or blocked.search(concluded):
                  findings.append((name,version,'REVIEW',declared,concluded))
          out=pathlib.Path('evidence/license-review.txt')
          out.write_text('PASS: no configured high-risk or unknown license finding.\n' if not findings else '\n'.join('\t'.join(map(str,x)) for x in findings)+'\n',encoding='utf-8')
          if findings:
              print(out.read_text(encoding='utf-8'))
              sys.exit('License/provenance review required; public IP evidence package is fail-closed.')
      - name: Record timestamp scope
        shell: bash
        run: |
          printf '%s\n' \
            'qualified_timestamp=NOT_REQUESTED' \
            'owner_policy=Paid qualified TSA timestamps are reserved for Jarvis / jeniksoft/codex-private-memory.' \
            'exception=Use a qualified timestamp here only after explicit owner opt-in for this milestone.' \
            > evidence/timestamp-scope.txt
      - name: Build evidence manifest
        shell: bash
        run: (cd evidence && find . -maxdepth 1 -type f ! -name evidence-manifest.sha256 -print0 | sort -z | xargs -0 sha256sum) > evidence/evidence-manifest.sha256
      - name: Final hashes
        shell: bash
        run: (cd evidence && find . -maxdepth 1 -type f ! -name final-sha256.txt -print0 | sort -z | xargs -0 sha256sum) > evidence/final-sha256.txt
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: public-ip-evidence-${{ github.sha }}-${{ inputs.milestone }}
          path: evidence/
          if-no-files-found: error
          retention-days: 90
