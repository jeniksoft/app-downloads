<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="svg-title svg-desc" viewBox="0 0 1480 900" width="1480" height="900"><title id="svg-title">Roadmapa produktu a progress edic Jarvis</title><desc id="svg-desc">Veřejná roadmapa používá pevné fajfky a křížky pro stav bran; procentní evidence track je aktivní pouze pro Personal.</desc><style>
:root {
  --background: #ffffff;
  --foreground: #1f2328;
  --muted: #656d76;
  --border: #d0d7de;
  --grid: #e6ebf1;
  --track: #f0f3f6;
  --series-1: #0969da;
  --series-2: #8250df;
  --series-3: #1a7f37;
  --series-4: #bc4c00;
  --series-5: #cf222e;
  --series-6: #6e7781;
}
@media (prefers-color-scheme: dark) {
  :root {
    --background: #0d1117;
    --foreground: #e6edf3;
    --muted: #8b949e;
    --border: #30363d;
    --grid: #21262d;
    --track: #161b22;
    --series-1: #58a6ff;
    --series-2: #d2a8ff;
    --series-3: #56d364;
    --series-4: #ffa657;
    --series-5: #ff7b72;
    --series-6: #8b949e;
  }
}
svg { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
.background { fill: var(--background); }
.title { fill: var(--foreground); font-size: 26px; font-weight: 500; }
.subtitle { fill: var(--muted); font-size: 15px; }
.label { fill: var(--foreground); font-size: 15px; }
.value { fill: var(--foreground); font-size: 16px; font-weight: 500; }
.small { fill: var(--muted); font-size: 12px; }
.axis-title { fill: var(--muted); font-size: 13px; }
.axis { stroke: var(--border); stroke-width: 1; }
.grid { stroke: var(--grid); stroke-width: 1; }
.track { fill: var(--track); }
.series-1 { fill: var(--series-1); stroke: var(--series-1); }
.series-2 { fill: var(--series-2); stroke: var(--series-2); }
.series-3 { fill: var(--series-3); stroke: var(--series-3); }
.series-4 { fill: var(--series-4); stroke: var(--series-4); }
.series-5 { fill: var(--series-5); stroke: var(--series-5); }
.series-6 { fill: var(--series-6); stroke: var(--series-6); }
.line-1 { fill: none; stroke: var(--series-1); stroke-width: 3; }
.line-2 { fill: none; stroke: var(--series-2); stroke-width: 3; }
.line-3 { fill: none; stroke: var(--series-3); stroke-width: 3; }
.line-4 { fill: none; stroke: var(--series-4); stroke-width: 3; }
.node { fill: var(--background); stroke: var(--border); stroke-width: 1.5; }
.node-accent { fill: var(--series-1); opacity: .18; }
.state-verified-runtime { fill: var(--series-3); }
.state-verified-build { fill: var(--series-1); }
.state-verified-contract { fill: var(--series-2); }
.state-in-progress { fill: var(--series-4); }
.state-implemented-unverified { fill: var(--series-4); }
.state-partial { fill: var(--series-4); }
.state-contract-only { fill: var(--series-5); }
.state-research-only, .state-open { fill: var(--series-6); }
.state-label { fill: var(--foreground); font-size: 13px; font-weight: 500; }
.tile { stroke: var(--border); stroke-width: 1; }
.status-stripe { opacity: .95; }
.tile-stripe { opacity: .95; }
.progress-track { fill: var(--track); stroke: var(--border); stroke-width: .5; }
.progress-fill { fill: var(--series-1); opacity: .9; }
.change { fill: var(--foreground); font-size: 12px; }
.cover-panel { fill: #0b1220; }
.cover-gradient { fill: url(#cover-accent); opacity: .78; }
.cover-grid { fill: none; stroke: #203754; stroke-width: 1; opacity: .82; }
.cover-kicker { fill: #8fd3ff; font-size: 13px; font-weight: 700; letter-spacing: 1.5px; }
.cover-title { fill: #f8fafc; font-size: 48px; font-weight: 700; }
.cover-subtitle { fill: #d1d9e6; font-size: 19px; }
.cover-note { fill: #93a4bb; font-size: 14px; }
.cover-stamp { fill: #a9e7c0; font-size: 12px; font-weight: 600; letter-spacing: .8px; }
.cover-network-line { fill: none; stroke: #5da9ff; stroke-width: 2; opacity: .72; }
.cover-network-node { fill: #0e213d; stroke: #63b3ff; stroke-width: 2; }
.cover-network-core { fill: #c66b2d; stroke: #ffd6a5; stroke-width: 2; }
.cover-network-label { fill: #dce7f4; font-size: 12px; font-weight: 600; letter-spacing: .7px; }
.cover-card { fill: #111f35; stroke: #30496a; stroke-width: 1; }
.cover-card-label { fill: #8fa5bf; font-size: 11px; font-weight: 600; letter-spacing: .8px; }
.cover-card-value { fill: #f8fafc; font-size: 20px; font-weight: 700; }
.roadmap-row { fill: var(--background); stroke: var(--border); stroke-width: 1; }
.roadmap-card { fill: var(--background); stroke: var(--border); stroke-width: 1; }
.roadmap-icon { fill: var(--background); stroke-width: 2; }
.roadmap-badge { fill: var(--track); stroke: var(--border); stroke-width: 1; }
.roadmap-complete { fill: var(--series-3); }
.roadmap-open { fill: var(--series-4); }
.roadmap-planned { fill: var(--series-6); }
.roadmap-check { fill: var(--background); font-size: 24px; font-weight: 700; }
.roadmap-cross { fill: var(--background); font-size: 24px; font-weight: 700; }
.roadmap-planned-text { fill: var(--background); }
.roadmap-track { fill: var(--track); stroke: var(--border); stroke-width: .5; }
.roadmap-fill { fill: var(--series-1); opacity: .9; }
.roadmap-track-inactive { fill: none; stroke: var(--muted); stroke-dasharray: 6 5; opacity: .72; }
.roadmap-note { fill: var(--muted); font-size: 13px; }
