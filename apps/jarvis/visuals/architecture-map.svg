<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="svg-title svg-desc" viewBox="0 0 1380 610" width="1380" height="610"><title id="svg-title">Jarvis architecture dependency map</title><desc id="svg-desc">A labeled dependency graph of the eight evidence-bound architecture chapters.</desc><style>
:root {
  --background: #ffffff;
  --foreground: #1f2328;
  --muted: #656d76;
  --border: #d0d7de;
  --grid: #e6ebf1;
  --track: #f0f3f6;
  --series-1: #0969da;
  --series-2: #8250df;
  --series-3: #1a7f37;
  --series-4: #bc4c00;
  --series-5: #cf222e;
  --series-6: #6e7781;
}
@media (prefers-color-scheme: dark) {
  :root {
    --background: #0d1117;
    --foreground: #e6edf3;
    --muted: #8b949e;
    --border: #30363d;
    --grid: #21262d;
    --track: #161b22;
    --series-1: #58a6ff;
    --series-2: #d2a8ff;
    --series-3: #56d364;
    --series-4: #ffa657;
    --series-5: #ff7b72;
    --series-6: #8b949e;
  }
}
svg { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
.background { fill: var(--background); }
.title { fill: var(--foreground); font-size: 26px; font-weight: 500; }
.subtitle { fill: var(--muted); font-size: 15px; }
.label { fill: var(--foreground); font-size: 15px; }
.value { fill: var(--foreground); font-size: 16px; font-weight: 500; }
.small { fill: var(--muted); font-size: 12px; }
.axis-title { fill: var(--muted); font-size: 13px; }
.axis { stroke: var(--border); stroke-width: 1; }
.grid { stroke: var(--grid); stroke-width: 1; }
.track { fill: var(--track); }
.series-1 { fill: var(--series-1); stroke: var(--series-1); }
.series-2 { fill: var(--series-2); stroke: var(--series-2); }
.series-3 { fill: var(--series-3); stroke: var(--series-3); }
.series-4 { fill: var(--series-4); stroke: var(--series-4); }
.series-5 { fill: var(--series-5); stroke: var(--series-5); }
.series-6 { fill: var(--series-6); stroke: var(--series-6); }
.line-1 { fill: none; stroke: var(--series-1); stroke-width: 3; }
.line-2 { fill: none; stroke: var(--series-2); stroke-width: 3; }
.line-3 { fill: none; stroke: var(--series-3); stroke-width: 3; }
.line-4 { fill: none; stroke: var(--series-4); stroke-width: 3; }
.node { fill: var(--background); stroke: var(--border); stroke-width: 1.5; }
.node-accent { fill: var(--series-1); opacity: .18; }
.state-verified-runtime { fill: var(--series-3); }
.state-verified-build { fill: var(--series-1); }
.state-verified-contract { fill: var(--series-2); }
.state-in-progress { fill: var(--series-4); }
.state-implemented-unverified { fill: var(--series-4); }
.state-partial { fill: var(--series-4); }
.state-contract-only { fill: var(--series-5); }
.state-research-only, .state-open { fill: var(--series-6); }
.state-label { fill: var(--foreground); font-size: 13px; font-weight: 500; }
.tile { stroke: var(--border); stroke-width: 1; }
.tile-stripe { opacity: .95; }
.change { fill: var(--foreground); font-size: 12px; }
</style><rect class="background" x="0" y="0" width="1380" height="610"/><text class="title" x="42.0" y="48.0" text-anchor="start">Architecture map — chapter dependency flow</text><text class="subtitle" x="42.0" y="78.0" text-anchor="start">Šipky zachovávají pořadí architektonických závislostí; hodnoty jsou popisky uzlů, ne samostatná tabulka.</text><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--border)"/></marker></defs><path class="axis" d="M 300.0 208.0 H 360.0" fill="none" marker-end="url(#arrow)"/><path class="axis" d="M 620.0 208.0 H 680.0" fill="none" marker-end="url(#arrow)"/><path class="axis" d="M 940.0 208.0 H 1000.0" fill="none" marker-end="url(#arrow)"/><path class="axis" d="M 1130.0 256.0 V 380.0" fill="none" marker-end="url(#arrow)"/><path class="axis" d="M 1000.0 428.0 H 940.0" fill="none" marker-end="url(#arrow)"/><path class="axis" d="M 680.0 428.0 H 620.0" fill="none" marker-end="url(#arrow)"/><path class="axis" d="M 360.0 428.0 H 300.0" fill="none" marker-end="url(#arrow)"/><rect class="node" x="40.0" y="160.0" width="260" height="96"><title>Aplikační shell, instalátor, update a veřejný kanál — in-progress</title></rect><rect class="state-in-progress" x="40.0" y="160.0" width="10" height="96"/><text class="label" x="64.0" y="188.0" text-anchor="start">App shell</text><text class="state-label" x="64.0" y="212.0" text-anchor="start">in-progress</text><text class="value" x="64.0" y="236.0" text-anchor="start">hotovo 31.25%</text><rect class="node" x="360.0" y="160.0" width="260" height="96"><title>Worker core, konverzace, fronta a recovery — in-progress</title></rect><rect class="state-in-progress" x="360.0" y="160.0" width="10" height="96"/><text class="label" x="384.0" y="188.0" text-anchor="start">Worker/recovery</text><text class="state-label" x="384.0" y="212.0" text-anchor="start">in-progress</text><text class="value" x="384.0" y="236.0" text-anchor="start">hotovo 37.50%</text><rect class="node" x="680.0" y="160.0" width="260" height="96"><title>Model providery, profily, routing a fallback — in-progress</title></rect><rect class="state-in-progress" x="680.0" y="160.0" width="10" height="96"/><text class="label" x="704.0" y="188.0" text-anchor="start">Models/routing</text><text class="state-label" x="704.0" y="212.0" text-anchor="start">in-progress</text><text class="value" x="704.0" y="236.0" text-anchor="start">hotovo 62.50%</text><rect class="node" x="1000.0" y="160.0" width="260" height="96"><title>Workspace, memory, source, patch, build, Git a web — in-progress</title></rect><rect class="state-in-progress" x="1000.0" y="160.0" width="10" height="96"/><text class="label" x="1024.0" y="188.0" text-anchor="start">Workspace/actions</text><text class="state-label" x="1024.0" y="212.0" text-anchor="start">in-progress</text><text class="value" x="1024.0" y="236.0" text-anchor="start">hotovo 62.50%</text><rect class="node" x="1000.0" y="380.0" width="260" height="96"><title>Extension discovery, manager a permissions — in-progress</title></rect><rect class="state-in-progress" x="1000.0" y="380.0" width="10" height="96"/><text class="label" x="1024.0" y="408.0" text-anchor="start">Extensions</text><text class="state-label" x="1024.0" y="432.0" text-anchor="start">in-progress</text><text class="value" x="1024.0" y="456.0" text-anchor="start">hotovo 6.25%</text><rect class="node" x="680.0" y="380.0" width="260" height="96"><title>Policy-bound MCP, plugin a app executor runtime — in-progress</title></rect><rect class="state-in-progress" x="680.0" y="380.0" width="10" height="96"/><text class="label" x="704.0" y="408.0" text-anchor="start">Executor</text><text class="state-label" x="704.0" y="432.0" text-anchor="start">in-progress</text><text class="value" x="704.0" y="456.0" text-anchor="start">hotovo 18.75%</text><rect class="node" x="360.0" y="380.0" width="260" height="96"><title>Owner-facing UX, diagnostika, support a lokalizace — in-progress</title></rect><rect class="state-in-progress" x="360.0" y="380.0" width="10" height="96"/><text class="label" x="384.0" y="408.0" text-anchor="start">UX/support</text><text class="state-label" x="384.0" y="432.0" text-anchor="start">in-progress</text><text class="value" x="384.0" y="456.0" text-anchor="start">hotovo 18.75%</text><rect class="node" x="40.0" y="380.0" width="260" height="96"><title>End-to-end QA, dogfooding a bezpečnostní audity — in-progress</title></rect><rect class="state-in-progress" x="40.0" y="380.0" width="10" height="96"/><text class="label" x="64.0" y="408.0" text-anchor="start">QA/dogfood</text><text class="state-label" x="64.0" y="432.0" text-anchor="start">in-progress</text><text class="value" x="64.0" y="456.0" text-anchor="start">hotovo 25.00%</text></svg>
