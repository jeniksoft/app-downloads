<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1160 660" width="1160" height="660">
<title id="title">Jarvis: aktuální implementace podle kanonických řezů</title>
<desc id="desc">Implementováno 765 ze 766 řezů, 99,87 procenta. Sedm skupin roadmapy: platformní základy 54/54, jádro runtime 64/64, Personal 126/127, volitelné schopnosti 132/132, Teams 70/70, Enterprise 63/63, průřezové schopnosti 256/256. Nejde o připravenost veřejného vydání.</desc>
<style>
svg{background:#0d2031}text{font-family:system-ui,Segoe UI,sans-serif;fill:#edf6f9}.eyebrow{font-size:16px;letter-spacing:2px;fill:#cda382;font-weight:700}.headline{font-size:76px;font-weight:800;fill:#fff}.sub{font-size:20px;fill:#b9d1dc}.row-title{font-size:18px;font-weight:600}.row-value{font-size:17px;fill:#c6dbe3}.track{fill:#294454}.foot{font-size:15px;fill:#b9d1dc}
</style>
