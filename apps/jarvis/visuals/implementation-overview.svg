" width="112.0" height="350.0"/><rect class="series-3" x="564.0" y="361.2" width="112.0" height="113.8" opacity=".88"><title>Verification: 32.50%</title></rect><text class="value" x="620.0" y="349.2" text-anchor="middle">32.50%</text><text class="label" x="620.0" y="507.0" text-anchor="middle">Verification</text><rect class="track" x="749.3" y="125.0" width="112.0" height="350.0"/><rect class="series-4" x="749.3" y="361.2" width="112.0" height="113.8" opacity=".88"><title>Done: 32.50%</title></rect><text class="value" x="805.3" y="349.2" text-anchor="middle">32.50%</text><text class="label" x="805.3" y="507.0" text-anchor="middle">Done</text><rect class="track" x="934.7" y="125.0" width="112.0" height="350.0"/><rect class="series-5" x="934.7" y="300.0" width="112.0" height="175.0" opacity=".88"><title>Release readiness: 50.00%</title></rect><text class="value" x="990.7" y="288.0" text-anchor="middle">50.00%</text><text class="label" x="990.7" y="507.0" text-anchor="middle">Release</text><text class="label" x="990.7" y="529.0" text-anchor="middle">readiness</text><text class="subtitle" x="44.0" y="565.0" text-anchor="start">Primární index je konzervativní minimum implementace a ověření; Task Board dodává pouze strukturu a synchronizaci evidence.</text></svg>
