<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1580 1000" width="1580" height="1000">
<title id="title">Mapa schopností Maunder Jarvis</title>
<desc id="desc">Sci-fi mapa závislostí schopností Jarvise se stavy ověřeno, testuje se, neotestováno a neimplementováno.</desc>
